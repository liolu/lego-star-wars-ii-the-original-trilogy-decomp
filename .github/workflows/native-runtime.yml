# Runtime natif de ce jeu (dossier native/, copie par runtime_sync.py du studio Nds Game Studio) : verifie sans rom a chaque
# changement, et publie a chaque etiquette runtime-v<n> l'archive que le launcher telecharge (native-runtime-<n>.zip, SHA256SUMS).
# Aucune rom ni aucun code du jeu dans l'archive : la generation se fait chez le joueur, depuis sa rom.
name: Native runtime

on:
  push:
    branches: [main]
    tags: ['runtime-v*']
    # GitHub n'applique pas ces chemins aux etiquettes : une etiquette runtime-v<n> publie toujours
    paths:
      - 'native/**'
      - '.github/workflows/native-runtime.yml'
  pull_request:
    paths:
      - 'native/**'
  workflow_dispatch:

jobs:
  runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # WinLibs, comme la boite commune du launcher
      - name: WinLibs
        shell: pwsh
        run: |
          $zip = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r1/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r1.zip"
          Invoke-WebRequest $zip -OutFile "$env:RUNNER_TEMP/winlibs.zip"
          Expand-Archive "$env:RUNNER_TEMP/winlibs.zip" -DestinationPath "$env:RUNNER_TEMP/winlibs"
          "$env:RUNNER_TEMP/winlibs/mingw64/bin" | Out-File -Append -Encoding ascii $env:GITHUB_PATH
          python -m pip install capstone==5.0.7
      - name: Runtime compile en 64 bits (les modules des joueurs)
        run: python native/tests/runtime_check.py --arch x86_64
      - name: Runtime compile en 32 bits
        run: python native/tests/runtime_check.py
      - name: Traducteur, accroches et fils verts (harnais, 32 bits)
        run: python native/tests/arm2c_test.py

  runtime-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Capstone
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install capstone==5.0.7
      - name: Runtime compile avec -Werror
        run: '"$RUNNER_TEMP/venv/bin/python" native/tests/runtime_check.py --arch ${{ matrix.arch }}'
      - name: Traducteur, accroches et fils verts (harnais)
        run: '"$RUNNER_TEMP/venv/bin/python" native/tests/arm2c_test.py --arch ${{ matrix.arch }}'

  release:
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    needs: [runtime-windows, runtime-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Archive et SHA256SUMS
        run: |
          version="${GITHUB_REF_NAME#runtime-v}"
          test "$version" = "$(tr -d '[:space:]' < native/VERSION)" || { echo "native/VERSION ne dit pas $version"; exit 1; }
          python3 native/tools/runtime_package.py AL7E --version "$version" --out dist
      - name: Publier
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Runtime natif $GITHUB_REF_NAME" --notes "Telecharge par Nds Game Studio pour generer ce jeu depuis la rom du joueur. Aucun code du jeu."
